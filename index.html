<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokyo Clock</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .label { font-size: 1.1rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
    #time { font-size: clamp(3rem, 12vw, 7rem); font-variant-numeric: tabular-nums; font-weight: 600; margin: 0.2em 0; }
    #date { font-size: 1.25rem; opacity: 0.7; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f5f5f7; }
    }
  </style>
</head>
<body>
  <div class="label">Tokyo, Japan (JST)</div>
  <div id="time">--:--:--</div>
  <div id="date"></div>
  <script>
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const timeFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const dateFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tokyo', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    function tick() {
      const now = new Date();
      timeEl.textContent = timeFmt.format(now);
      dateEl.textContent = dateFmt.format(now);
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
